<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">From upload to published</title>
  <desc id="d">A file arrives through an upload in the Media Library or a watchfolder. The ingest rules decide its name, its content type, what happens to duplicates and whether metadata is needed first; the content type says which fields it has. The accepted file is encoded to a ladder from Encoding Profiles and lands in the Media Library as an asset. Publishing it follows the publishing rules, after a review if the rule's gate asks for one, and sends it to the catalogue, your apps or social accounts, where viewers watch it.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#8a93a6"/></marker>
    <style>
      .box text{fill:#ffffff}
      .t{font-size:16px;font-weight:650}
      .s{font-size:12.5px;opacity:.92}
      .ln{fill:none;stroke:#8a93a6;stroke-width:2;marker-end:url(#a)}
      .lb{fill:#8a93a6;font-size:12px}
    </style>
  </defs>
  <!-- arrows first, so boxes sit on top -->
  <path class="ln" d="M190 85 H267"/>
  <text class="lb" x="200" y="77">a file</text>
  <path class="ln" d="M440 85 H517"/>
  <text class="lb" x="450" y="77">accepted</text>
  <text class="lb" x="450" y="104">and typed</text>
  <path class="ln" d="M690 85 H767"/>
  <text class="lb" x="700" y="77">renditions</text>
  <path class="ln" d="M355 215 V128"/>
  <text class="lb" x="365" y="176">fields, required ones</text>
  <path class="ln" d="M875 125 V212"/>
  <text class="lb" x="885" y="166">Publish</text>
  <text class="lb" x="885" y="183">(review first,</text>
  <text class="lb" x="885" y="200">if gated)</text>
  <path class="ln" d="M770 255 H693"/>
  <text class="lb" x="704" y="247">published</text>
  <text class="lb" x="704" y="274">to them</text>
  <!-- boxes -->
  <g class="box"><rect x="20" y="45" width="170" height="80" rx="10" fill="#475569"/><text class="t" x="35" y="77">Files</text><text class="s" x="35" y="98">Media Library upload</text><text class="s" x="35" y="115">or a Watchfolder</text></g>
  <g class="box"><rect x="270" y="45" width="170" height="80" rx="10" fill="#5b4fd6"/><text class="t" x="285" y="77">Ingest Rules</text><text class="s" x="285" y="98">name, type, duplicates,</text><text class="s" x="285" y="115">metadata first</text></g>
  <g class="box"><rect x="520" y="45" width="170" height="80" rx="10" fill="#5b4fd6"/><text class="t" x="535" y="77">Encoding Profiles</text><text class="s" x="535" y="98">the ladder it is</text><text class="s" x="535" y="115">encoded to</text></g>
  <g class="box"><rect x="770" y="45" width="210" height="80" rx="10" fill="#0f766e"/><text class="t" x="786" y="77">Media Library</text><text class="s" x="786" y="98">the asset: metadata,</text><text class="s" x="786" y="115">encode, availability</text></g>
  <g class="box"><rect x="270" y="215" width="170" height="80" rx="10" fill="#475569"/><text class="t" x="285" y="247">Content Types</text><text class="s" x="285" y="268">what each kind</text><text class="s" x="285" y="285">of asset records</text></g>
  <g class="box"><rect x="520" y="215" width="170" height="80" rx="10" fill="#b45309"/><text class="t" x="535" y="247">Viewers</text><text class="s" x="535" y="268">catalogue, your apps,</text><text class="s" x="535" y="285">social accounts</text></g>
  <g class="box"><rect x="770" y="215" width="210" height="80" rx="10" fill="#b45309"/><text class="t" x="786" y="247">Publishing Rules</text><text class="s" x="786" y="268">account, type, item;</text><text class="s" x="786" y="285">the review gate</text></g>
</svg>
