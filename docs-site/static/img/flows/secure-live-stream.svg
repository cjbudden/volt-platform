<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Securing a live stream</title>
  <desc id="d">Where a stream can be watched is narrowed in three steps: the account-wide geo rule in Account settings, the channel's own geo and access rules, and the rights per programme in the EPG. The channel page's rights preview shows what any viewer would get. The play gate applies all of these rules when your registered app asks to play, together with the viewer's sign-in and purchases from Users and Roles and Payments, and gives the viewer's player a short-lived playback token and the stream's addresses.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#8a93a6"/></marker>
    <style>
      .box text{fill:#ffffff}
      .t{font-size:16px;font-weight:650}
      .s{font-size:12.5px;opacity:.92}
      .ln{fill:none;stroke:#8a93a6;stroke-width:2;marker-end:url(#a)}
      .lb{fill:#8a93a6;font-size:12px}
    </style>
  </defs>
  <!-- arrows first, so boxes sit on top -->
  <path class="ln" d="M210 75 H277"/>
  <text class="lb" x="218" y="67">narrowed</text>
  <path class="ln" d="M470 75 H537"/>
  <text class="lb" x="478" y="67">narrowed</text>
  <path class="ln" d="M640 120 V187"/>
  <text class="lb" x="648" y="158">where and when</text>
  <path class="ln" d="M440 230 H537"/>
  <text class="lb" x="450" y="222">your app asks</text>
  <path class="ln" d="M440 360 H640 V273"/>
  <text class="lb" x="452" y="352">sign-in, purchases</text>
  <path class="ln" d="M740 230 H842"/>
  <text class="lb" x="748" y="222">playback token</text>
  <!-- boxes -->
  <g class="box"><rect x="20" y="30" width="190" height="90" rx="10" fill="#5b4fd6"/><text class="t" x="35" y="62">Account settings</text><text class="s" x="35" y="86">account-wide geo</text></g>
  <g class="box"><rect x="280" y="30" width="190" height="90" rx="10" fill="#3f63e0"/><text class="t" x="296" y="62">Channel</text><text class="s" x="296" y="86">own geo · access rules</text><text class="s" x="296" y="105">rights preview</text></g>
  <g class="box"><rect x="540" y="30" width="200" height="90" rx="10" fill="#5b4fd6"/><text class="t" x="556" y="62">EPG</text><text class="s" x="556" y="86">rights per programme:</text><text class="s" x="556" y="105">block or replace</text></g>
  <g class="box"><rect x="540" y="190" width="200" height="80" rx="10" fill="#0f766e"/><text class="t" x="556" y="222">Play gate</text><text class="s" x="556" y="244">applies every rule</text></g>
  <g class="box"><rect x="240" y="190" width="200" height="80" rx="10" fill="#b45309"/><text class="t" x="256" y="222">API Keys &amp; Apps</text><text class="s" x="256" y="244">only your apps' keys</text></g>
  <g class="box"><rect x="240" y="320" width="200" height="80" rx="10" fill="#475569"/><text class="t" x="256" y="352">Payments</text><text class="s" x="256" y="374">and Users &amp; Roles</text></g>
  <g class="box"><rect x="845" y="190" width="135" height="80" rx="10" fill="#b45309"/><text class="t" x="860" y="222">Viewer</text><text class="s" x="860" y="244">the player</text></g>
</svg>
