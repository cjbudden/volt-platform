<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">A 24/7 channel that never goes dark</title>
  <desc id="d">Two live feeds, a primary and a backup, go into the channel. A channel group holds the channel and gives it its type and share of the plan, and Loops and Fillers gives it a slate or loop. Failover picks the primary, then the backup, then the filler, so viewers always get a picture. The channel's status and faults go to Monitoring, which lists the problems, and to Notifications, which alerts the owners and administrators.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#8a93a6"/></marker>
    <style>
      .box text{fill:#ffffff}
      .t{font-size:16px;font-weight:650}
      .s{font-size:12.5px;opacity:.92}
      .ln{fill:none;stroke:#8a93a6;stroke-width:2;marker-end:url(#a)}
      .lb{fill:#8a93a6;font-size:12px}
    </style>
  </defs>
  <!-- arrows first, so boxes sit on top -->
  <path class="ln" d="M200 80 H297"/>
  <text class="lb" x="214" y="72">two feeds</text>
  <path class="ln" d="M600 80 H817"/>
  <text class="lb" x="640" y="72">output, never a dead screen</text>
  <path class="ln" d="M120 200 V165 H330 V133"/>
  <text class="lb" x="132" y="157">holds it: type and share</text>
  <path class="ln" d="M450 200 V133"/>
  <text class="lb" x="458" y="176">slate or loop</text>
  <path class="ln" d="M580 130 V165 H900 V197"/>
  <path class="ln" d="M720 165 V197"/>
  <text class="lb" x="732" y="157">status and faults</text>
  <!-- boxes -->
  <g class="box"><rect x="20" y="45" width="180" height="70" rx="10" fill="#475569"/><text class="t" x="35" y="75">Live sources</text><text class="s" x="35" y="96">primary · backup</text></g>
  <g class="box"><rect x="300" y="30" width="300" height="100" rx="10" fill="#3f63e0"/><text class="t" x="316" y="60">Channel</text><text class="s" x="316" y="84">Failover picks the primary,</text><text class="s" x="316" y="104">then the backup, then the filler</text></g>
  <g class="box"><rect x="820" y="45" width="160" height="70" rx="10" fill="#b45309"/><text class="t" x="836" y="75">Viewers</text><text class="s" x="836" y="96">always a picture</text></g>
  <g class="box"><rect x="20" y="200" width="210" height="70" rx="10" fill="#5b4fd6"/><text class="t" x="35" y="230">Channel Groups</text><text class="s" x="35" y="251">type · share of the plan</text></g>
  <g class="box"><rect x="360" y="200" width="180" height="70" rx="10" fill="#5b4fd6"/><text class="t" x="376" y="230">Loops &amp; Fillers</text><text class="s" x="376" y="251">slates · loops</text></g>
  <g class="box"><rect x="630" y="200" width="180" height="70" rx="10" fill="#0f766e"/><text class="t" x="646" y="230">Monitoring</text><text class="s" x="646" y="251">problems only</text></g>
  <g class="box"><rect x="820" y="200" width="160" height="70" rx="10" fill="#0f766e"/><text class="t" x="836" y="230">Notifications</text><text class="s" x="836" y="251">inbox · email · push</text></g>
</svg>
