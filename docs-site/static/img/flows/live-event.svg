<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">A live event from start to finish</title>
  <desc id="d">Events schedules the window and gives out a share link and a countdown player. The EPG lists the parts of the event inside the window. The event goes on air for its public window. Recordings holds what went out; clips cut from it go to Review, and approved clips land in the Media Library. The full event also arrives there as the replay, with Automatic VOD on end. Analytics reports who watched and how the event ran.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#8a93a6"/></marker>
    <style>
      .box text{fill:#ffffff}
      .t{font-size:16px;font-weight:650}
      .s{font-size:12.5px;opacity:.92}
      .ln{fill:none;stroke:#8a93a6;stroke-width:2;marker-end:url(#a)}
      .lb{fill:#8a93a6;font-size:12px}
    </style>
  </defs>
  <!-- arrows first, so boxes sit on top -->
  <path class="ln" d="M280 75 H367"/>
  <text class="lb" x="324" y="56" text-anchor="middle">the event's</text>
  <text class="lb" x="324" y="98" text-anchor="middle">window</text>
  <path class="ln" d="M630 75 H717"/>
  <text class="lb" x="674" y="56" text-anchor="middle">now and</text>
  <text class="lb" x="674" y="98" text-anchor="middle">next</text>
  <path class="ln" d="M850 110 V150 H115 V187"/>
  <text class="lb" x="500" y="143" text-anchor="middle">what went out is recorded</text>
  <path class="ln" d="M210 222 H270"/>
  <text class="lb" x="240" y="203" text-anchor="middle">clips</text>
  <path class="ln" d="M460 222 H520"/>
  <text class="lb" x="490" y="203" text-anchor="middle">approved</text>
  <path class="ln" d="M710 222 H770"/>
  <text class="lb" x="740" y="203" text-anchor="middle">views</text>
  <path class="ln" d="M115 257 V290 H615 V260"/>
  <text class="lb" x="365" y="306" text-anchor="middle">the full event: Automatic VOD on end</text>
  <!-- boxes -->
  <g class="box"><rect x="20" y="40" width="260" height="70" rx="10" fill="#3f63e0"/><text class="t" x="36" y="70">Events</text><text class="s" x="36" y="91">schedule, share link, player tag</text></g>
  <g class="box"><rect x="370" y="40" width="260" height="70" rx="10" fill="#5b4fd6"/><text class="t" x="386" y="70">EPG</text><text class="s" x="386" y="91">the parts of the event</text></g>
  <g class="box"><rect x="720" y="40" width="260" height="70" rx="10" fill="#3f63e0"/><text class="t" x="736" y="70">On air</text><text class="s" x="736" y="91">Events: the public window</text></g>
  <g class="box"><rect x="20" y="187" width="190" height="70" rx="10" fill="#0f766e"/><text class="t" x="36" y="217">Recordings</text><text class="s" x="36" y="238">clip while it runs</text></g>
  <g class="box"><rect x="270" y="187" width="190" height="70" rx="10" fill="#0f766e"/><text class="t" x="286" y="217">Review</text><text class="s" x="286" y="238">clips and QC</text></g>
  <g class="box"><rect x="520" y="187" width="190" height="70" rx="10" fill="#0f766e"/><text class="t" x="536" y="217">Media Library</text><text class="s" x="536" y="238">replay and clips</text></g>
  <g class="box"><rect x="770" y="187" width="210" height="70" rx="10" fill="#475569"/><text class="t" x="786" y="217">Analytics</text><text class="s" x="786" y="238">who watched, how it ran</text></g>
</svg>
