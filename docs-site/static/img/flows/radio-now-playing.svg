<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">A radio station with now playing</title>
  <desc id="d">An Icecast or SHOUTcast source sends a station its audio with now-playing titles in the stream's metadata. The station serves MP3, HLS and DASH with the titles carried in each, so listeners' players show the song. Every title change becomes a timed entry in the station's guide in the EPG. With recording on, the station's audio is kept in Recordings, where the guide entries mark each song and programme for clipping, and clips land in the Media Library.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#8a93a6"/></marker>
    <style>
      .box text{fill:#ffffff}
      .t{font-size:16px;font-weight:650}
      .s{font-size:12.5px;opacity:.92}
      .ln{fill:none;stroke:#8a93a6;stroke-width:2;marker-end:url(#a)}
      .lb{fill:#8a93a6;font-size:12px}
    </style>
  </defs>
  <!-- arrows first, so boxes sit on top -->
  <path class="ln" d="M190 85 H307"/>
  <text class="lb" x="200" y="74">audio and titles</text>
  <path class="ln" d="M510 85 H687"/>
  <text class="lb" x="520" y="74">MP3, HLS, DASH with titles</text>
  <path class="ln" d="M410 150 V197"/>
  <text class="lb" x="418" y="180">each title, timed</text>
  <path class="ln" d="M510 130 H690 V197"/>
  <text class="lb" x="698" y="175">recorded</text>
  <path class="ln" d="M510 235 H587"/>
  <text class="lb" x="526" y="226">the log</text>
  <path class="ln" d="M790 235 H827"/>
  <text class="lb" x="794" y="226">clips</text>
  <!-- boxes -->
  <g class="box"><rect x="20" y="50" width="170" height="70" rx="10" fill="#475569"/><text class="t" x="35" y="80">Your source</text><text class="s" x="35" y="101">Icecast or SHOUTcast</text></g>
  <g class="box"><rect x="310" y="50" width="200" height="100" rx="10" fill="#3f63e0"/><text class="t" x="326" y="82">Radio</text><text class="s" x="326" y="106">the station, its outputs</text><text class="s" x="326" y="126">and now-playing log</text></g>
  <g class="box"><rect x="690" y="50" width="290" height="70" rx="10" fill="#b45309"/><text class="t" x="706" y="80">Listeners</text><text class="s" x="706" y="101">players show the song as it is heard</text></g>
  <g class="box"><rect x="310" y="200" width="200" height="70" rx="10" fill="#5b4fd6"/><text class="t" x="326" y="230">EPG</text><text class="s" x="326" y="251">the station's guide and log</text></g>
  <g class="box"><rect x="590" y="200" width="200" height="70" rx="10" fill="#0f766e"/><text class="t" x="606" y="230">Recordings</text><text class="s" x="606" y="251">find a song, clip it</text></g>
  <g class="box"><rect x="830" y="200" width="150" height="70" rx="10" fill="#0f766e"/><text class="t" x="845" y="230">Media Library</text><text class="s" x="845" y="251">the clips</text></g>
</svg>
