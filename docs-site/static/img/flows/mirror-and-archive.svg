<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Copies of your media at your own sites</title>
  <desc id="d">Items in the Media Library and the recordings of your channels, stations and events are covered by copy rules in Publishing Rules, which name storage targets made on the Storage page. When an item lands, is published, nightly, or when a programme's recording ends, a copy job goes to the site that owns the target. An approved, online server of that site, from Sites, takes the job, copies the file to your folder, NAS share or S3-compatible store and reads it back. Storage shows each copy as verified, or corrupt or missing after a later check.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#8a93a6"/></marker>
    <style>
      .box text{fill:#ffffff}
      .t{font-size:16px;font-weight:650}
      .s{font-size:12.5px;opacity:.92}
      .ln{fill:none;stroke:#8a93a6;stroke-width:2;marker-end:url(#a)}
      .lb{fill:#8a93a6;font-size:12px}
    </style>
  </defs>
  <!-- arrows first, so boxes sit on top -->
  <path class="ln" d="M210 85 H267"/>
  <text class="lb" x="215" y="70">lands or</text>
  <text class="lb" x="213" y="110">published</text>
  <path class="ln" d="M440 85 H517"/>
  <text class="lb" x="450" y="77">a copy job</text>
  <text class="lb" x="450" y="104">(off-peak)</text>
  <path class="ln" d="M710 85 H767"/>
  <text class="lb" x="716" y="70">copied</text>
  <text class="lb" x="716" y="110">checked</text>
  <path class="ln" d="M615 215 V128"/>
  <text class="lb" x="625" y="166">approved,</text>
  <text class="lb" x="625" y="183">Online</text>
  <path class="ln" d="M355 215 V128"/>
  <text class="lb" x="365" y="166">storage</text>
  <text class="lb" x="365" y="183">targets</text>
  <path class="ln" d="M875 125 V308 H400 V299"/>
  <text class="lb" x="885" y="176">Verified,</text>
  <text class="lb" x="885" y="193">Corrupt,</text>
  <text class="lb" x="885" y="210">Missing</text>
  <!-- boxes -->
  <g class="box"><rect x="20" y="45" width="190" height="80" rx="10" fill="#0f766e"/><text class="t" x="35" y="77">Media Library</text><text class="s" x="35" y="98">originals, sidecars, clips,</text><text class="s" x="35" y="115">packages; recordings</text></g>
  <g class="box"><rect x="270" y="45" width="170" height="80" rx="10" fill="#5b4fd6"/><text class="t" x="285" y="77">Publishing Rules</text><text class="s" x="285" y="98">copy rules: what,</text><text class="s" x="285" y="115">where and when</text></g>
  <g class="box"><rect x="520" y="45" width="190" height="80" rx="10" fill="#475569"/><text class="t" x="535" y="77">Your site's server</text><text class="s" x="535" y="98">the Volt site agent</text><text class="s" x="535" y="115">makes each copy</text></g>
  <g class="box"><rect x="770" y="45" width="210" height="80" rx="10" fill="#b45309"/><text class="t" x="786" y="77">Your storage</text><text class="s" x="786" y="98">a folder, a NAS share or</text><text class="s" x="786" y="115">an S3-compatible store</text></g>
  <g class="box"><rect x="270" y="215" width="170" height="80" rx="10" fill="#5b4fd6"/><text class="t" x="285" y="247">Storage</text><text class="s" x="285" y="268">targets and copies,</text><text class="s" x="285" y="285">Check now</text></g>
  <g class="box"><rect x="520" y="215" width="190" height="80" rx="10" fill="#475569"/><text class="t" x="535" y="247">Sites</text><text class="s" x="535" y="268">the site and its</text><text class="s" x="535" y="285">approved servers</text></g>
</svg>
