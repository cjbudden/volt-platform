  var match=setW&&S.won[x]+1>=S.R.need,srv=who(data.server);
  return {n:n,dp:dp,what:match?'MATCH':setW?'SET':srv&&srv!==x+1?'BREAK':'GAME'}}
function plural(n,what){var w=what==='MATCH'&&on(data.championship)?'CHAMPIONSHIP':what;return n>1?n+' '+w+' POINTS':w+' POINT'}
function lastName(i){return String(data['p'+i+'Name']||'')}
function autoCallout(S){
  if(S.winner)return 'GAME, SET AND MATCH';
  if(S.justSet)return 'SET · '+lastName(S.justSet);
  var a=stake(S,0),b=stake(S,1),rank={MATCH:3,SET:2,BREAK:1,GAME:0};
  if(a&&b){var top=rank[a.what]>=rank[b.what]?a:b;return top.what==='MATCH'||top.what==='SET'?plural(1,top.what):'DECIDING POINT'}
  var k=a||b;if(k&&k.what!=='GAME')return plural(k.n,k.what);
  if(k&&k.dp)return 'DECIDING POINT';
  if(S.tb)return S.tb.match?'MATCH TIE-BREAK':'TIE-BREAK';
  if(S.pts&&!S.R.noAd&&S.pts[0]===3&&S.pts[1]===3)return 'DEUCE';
  return ''}
// A feed's match status, when it says play has stopped or how the match ended.
var FEED_STATUS={interrupted:'MATCH SUSPENDED',suspended:'MATCH SUSPENDED',delayed:'DELAYED',start_delayed:'DELAYED',postponed:'POSTPONED',
  abandoned:'ABANDONED',walkover:'WALKOVER',walkover1:'WALKOVER',walkover2:'WALKOVER',retired:'RETIRED',retired1:'RETIRED',retired2:'RETIRED',defaulted:'DEFAULTED',defaulted1:'DEFAULTED',defaulted2:'DEFAULTED'};
function feedStatus(v){if(v==null||v==='')return '';if(typeof v==='object')v=v.match_status!=null?v.match_status:v.status;return FEED_STATUS[String(v).toLowerCase().replace(/[\s-]+/g,'_')]||''}
function callout(S){var who=Number(data.calloutPlayer)||0,name=who?lastName(who):'',tag=function(t){return t&&name?t+' · '+name:t};
  var c=String(data.statusCustom||'').trim();if(c)return tag(c);
  var m=String(data.status||'').trim();if(m)return tag(m);
  var fs=feedStatus(data.matchStatus);if(fs)return fs;
  return data.autoCallouts==null||data.autoCallouts===''||on(data.autoCallouts)?autoCallout(S):''}
function apply(){
  var S=state(),wf=who(data.winner),w=wf>0?wf:S.winner,over=w>0,sets=asList(data.sets).map(pair).filter(Boolean),pts=over?null:points(),cur=sets.length&&!over&&S.ci===sets.length-1?sets.length-1:-1;
  var a=[],b=[];sets.forEach(function(s,i){var x=num(s[0]),y=num(s[1]),done=i!==cur;
    a.push({v:s[0],cls:i===cur?'cur':done&&x!=null&&y!=null&&x>y?'w':''});b.push({v:s[1],cls:i===cur?'cur':done&&x!=null&&y!=null&&y>x?'w':''})});
  cells(0,a,pts&&pts[0]);cells(1,b,pts&&pts[1]);
  // Once there is a winner the match is over: no live points, no serve marker, every set counted.
  var s=over?0:who(data.server);B.classList.toggle('s1',s===1);B.classList.toggle('s2',s===2);
  var sn=false&&data.serverNumber!=null&&data.serverNumber!==''?String(data.serverNumber):'';setText($('sn'),sn);B.classList.toggle('withnum',!!sn);
  $('r1').classList.toggle('won',w===1);$('r2').classList.toggle('won',w===2);$('r1').classList.toggle('lost',w===2);$('r2').classList.toggle('lost',w===1);
  setStatus(callout(S))}
function setStatus(v){var st=$('st');v=v==null?'':String(v);if(st.textContent===v&&st.classList.contains('show')===!!v)return;
  st.classList.add('live');if(!v){st.classList.remove('show','pulse');return}
  if(st.classList.contains('show')&&playing){st.classList.remove('show');setTimeout(function(){st.textContent=v;st.classList.add('show')},380)}
  else{st.textContent=v;st.classList.add('show')}
  st.classList.toggle('pulse',/MATCH POINT|CHAMPIONSHIP|SET POINT|BREAK/i.test(v))}
function sizeNames(){var w=280;[].forEach.call(document.querySelectorAll('.nm'),function(n){n.style.fontSize='';
  var probe=document.createElement('span');probe.style.cssText='position:absolute;visibility:hidden;white-space:nowrap;font:inherit';probe.textContent=n.textContent;n.appendChild(probe);
  w=Math.max(w,probe.offsetWidth+110);probe.remove()});w=Math.min(w,520);css('--nameW',w+'px');
  [].forEach.call(document.querySelectorAll('.nm'),function(n){fit(n,.75)})}
function player(i,d){var r=$('r'+i);
  if(('p'+i+'Name') in d)setText(r.querySelector('.nm'),d['p'+i+'Name']);
  if(('p'+i+'Image') in d){var img=r.querySelector('.flag');img.setAttribute('src',d['p'+i+'Image']||'');r.classList.toggle('hasimg',!!d['p'+i+'Image'])}
  if(d['p'+i+'Color'])css('--p'+i,d['p'+i+'Color'])}
function update(raw){var d=parse(raw);for(var k in d)data[k]=d[k];
  css('--accent',d.accent);css('--accentInk',d.accentText);if(d.panelColor)css('--panel',d.panelColor);css('--ball',d.ballColor);
  if('title' in d)setText($('ttl'),d.title||'');player(1,d);player(2,d);
  if('p1Name' in d||'p2Name' in d)sizeNames();
  apply()}
function onPlay(){$('st').classList.remove('live')}
function onReset(){$('st').classList.remove('live')}
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(sizeNames);
