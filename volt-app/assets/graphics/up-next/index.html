<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Up next</title>
<!-- Volt template: CasparCG HTML contract (update / play / next / stop), 1920x1080, transparent.
     In and out sequences: see volt-app/docs/GRAPHICS_TEMPLATE_STANDARD.md section 4.
     Standard: volt-app/docs/GRAPHICS_TEMPLATE_STANDARD.md -->
<script type="application/json" id="volt-manifest">
{
  "contract": "casparcg-html",
  "canvas": [
    1920,
    1080
  ],
  "fps": 25,
  "name": "Up next (coming up, with thumbnail)",
  "bbox": [
    1168,
    58,
    656,
    128
  ],
  "fields": [
    {
      "id": "label",
      "type": "text",
      "label": "Label (UP NEXT, COMING UP, LATER)"
    },
    {
      "id": "title",
      "type": "text",
      "label": "Title"
    },
    {
      "id": "time",
      "type": "text",
      "label": "Time or detail"
    },
    {
      "id": "image",
      "type": "image",
      "label": "Thumbnail (optional, 16:9)"
    },
    {
      "id": "items",
      "type": "list",
      "label": "Several, rotating (optional): Title|Time"
    },
    {
      "id": "interval",
      "type": "number",
      "label": "Seconds per item (default 6)"
    },
    {
      "id": "accent",
      "type": "color",
      "label": "Label colour"
    },
    {
      "id": "panelColor",
      "type": "color",
      "label": "Panel colour"
    },
    {
      "id": "subColor",
      "type": "color",
      "label": "Time colour"
    }
  ],
  "sample": {
    "label": "UP NEXT",
    "title": "The Business Hour",
    "time": "7:00 PM",
    "image": "",
    "items": [],
    "interval": 6,
    "accent": "#c1121f",
    "panelColor": "#0a2350",
    "subColor": "#c9d3e6"
  }
}
</script>
<style>
@font-face{font-family:"Volt Serif";src:url(fonts/serif-400.woff2) format("woff2");font-weight:400;font-display:block}
@font-face{font-family:"Volt Serif";src:url(fonts/serif-600.woff2) format("woff2");font-weight:600;font-display:block}
@font-face{font-family:"Volt Sans";src:url(fonts/sans-500.woff2) format("woff2");font-weight:500;font-display:block}
@font-face{font-family:"Volt Sans";src:url(fonts/sans-700.woff2) format("woff2");font-weight:700;font-display:block}
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:transparent}
body{font-family:"Volt Sans","Noto Sans CJK SC","Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK JP","Noto Sans CJK KR",Arial,sans-serif;color:#fff;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
:root{--ein:cubic-bezier(.16,1,.3,1);--eout:cubic-bezier(.7,0,.84,0);--pop:cubic-bezier(.34,1.56,.64,1)}
/* Three states: initial (hidden), .on (in sequence to on air), .out (out sequence to a different
   hidden pose). After the out sequence .reset snaps back to initial with no transition. */
.reset *,.reset *::before,.reset *::after{transition:none!important;animation:none!important}
:root{--accent:#c1121f;--panel:#0a2350;--sub:#c9d3e6}
#un{position:absolute;right:96px;top:58px;width:656px;height:128px;display:flex;background:var(--panel);
  box-shadow:0 8px 22px rgba(0,0,0,.35);clip-path:inset(0 0 0 100%)}
#th{width:228px;height:128px;flex:none;overflow:hidden}
#th img{width:100%;height:100%;object-fit:cover;display:block;transform:scale(1.18)}
.noimg #th{display:none}
#bd{flex:1;min-width:0;padding:16px 24px;display:flex;flex-direction:column;justify-content:center;gap:10px}
#chip{align-self:flex-start;background:var(--accent);font:700 22px/1 "Volt Sans","Noto Sans CJK SC","Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK JP","Noto Sans CJK KR",Arial,sans-serif;letter-spacing:.12em;text-transform:uppercase;padding:6px 10px;transform:translateY(-14px);opacity:0}
#sw{transition:opacity .25s,transform .25s var(--ein)}
#sw.xf{opacity:0;transform:translateY(-8px)}
#ti{font:600 36px/1.1 "Volt Serif","Noto Sans CJK SC","Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK JP","Noto Sans CJK KR",Arial,sans-serif;white-space:nowrap;overflow:hidden;transform:translateX(30px);opacity:0}
#tm{margin-top:8px;font:500 26px/1 "Volt Sans","Noto Sans CJK SC","Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK JP","Noto Sans CJK KR",Arial,sans-serif;color:var(--sub);white-space:nowrap;transform:translateX(30px);opacity:0}
#tm:empty{display:none}
/* in: the card wipes on from the right edge, the thumbnail settles (a slow push-out), then label,
   title and time arrive in turn */
.on #un{clip-path:inset(0 0 0 0);transition:clip-path .5s var(--ein)}
.on #th img{transform:none;transition:transform 6s cubic-bezier(.2,.6,.3,1) .1s}
.on #chip{transform:none;opacity:1;transition:transform .4s var(--pop) .3s,opacity .25s .3s}
.on #ti{transform:none;opacity:1;transition:transform .45s var(--ein) .42s,opacity .3s .42s}
.on #tm{transform:none;opacity:1;transition:transform .45s var(--ein) .52s,opacity .3s .52s}
/* out: the text clears to the left, then the card wipes off to the right */
.out #chip,.out #ti,.out #tm{transform:translateX(-20px);opacity:0;transition:transform .2s var(--eout),opacity .2s}
.out #un{clip-path:inset(0 0 0 100%);transition:clip-path .4s var(--eout) .15s}
</style>
</head>
<body>
<div id="un"><div id="th"><img id="img" src="" alt=""></div><div id="bd"><div id="chip"></div><div id="sw"><div id="ti"></div><div id="tm"></div></div></div></div>
<script>
function parse(d){if(typeof d!=='string')return d||{};try{return JSON.parse(d)}catch(e){return {}}}
function asList(v){if(v&&!Array.isArray(v)&&Array.isArray(v.items))v=v.items;if(Array.isArray(v))return v;if(typeof v==='string'&&v.trim())return v.split(/\n|\s*;\s*/).filter(Boolean);return []}
function txt(x){if(x==null)return '';if(typeof x==='string'||typeof x==='number')return String(x);return x.title||x.text||x.name||x.headline||''}
function $(id){return document.getElementById(id)}
function setText(el,v){v=v==null?'':String(v);if(el.textContent!==v)el.textContent=v}
function truthy(v){return !(v===false||v==='false'||v===0||v==='0'||v==='no'||v==='off')}
function css(k,v){if(v!=null&&v!=='')document.documentElement.style.setProperty(k,String(v))}
// Shrink one line until it fits its box, down to `floor` of its size.
function fit(el,floor){if(!el)return;el.style.fontSize='';var s=parseFloat(getComputedStyle(el).fontSize),min=s*(floor||.72);
  while(el.scrollWidth>el.clientWidth+1&&s>min){s-=1;el.style.fontSize=s+'px'}}
var B=document.body,data={},playing=false,resetTimer=null;
function play(){clearTimeout(resetTimer);B.classList.remove('out','reset');void B.offsetWidth;B.classList.add('on');playing=true;
  if(typeof onPlay==='function')onPlay()}
function stop(){if(!playing)return;playing=false;B.classList.add('out');B.classList.remove('on');
  if(typeof onStop==='function')onStop();clearTimeout(resetTimer);
  resetTimer=setTimeout(function(){B.classList.add('reset');B.classList.remove('out');void B.offsetWidth;B.classList.remove('reset');
    if(typeof onReset==='function')onReset()},OUT_MS)}
function next(){if(typeof onNext==='function')onNext()}
var OUT_MS=600;
var list=[],li=-1,rot=null;
function put(t,m){setText($('ti'),t);setText($('tm'),m);fit($('ti'),.72)}
function step(){if(!list.length){put(data.title||'',data.time||'');return}
  li=(li+1)%list.length;var it=list[li],sw=$('sw');
  if(!playing||li===0&&!sw.dataset.n){sw.dataset.n=1;put(it.t,it.m);return}
  sw.classList.add('xf');setTimeout(function(){put(it.t,it.m);sw.classList.remove('xf')},260)}
function startRot(){clearInterval(rot);if(playing&&list.length>1)rot=setInterval(step,Math.max(3,Number(data.interval)||6)*1000)}
function update(raw){var d=parse(raw);for(var k in d)data[k]=d[k];
  css('--accent',d.accent);css('--panel',d.panelColor);css('--sub',d.subColor);
  if('label' in d)setText($('chip'),d.label||'');
  if('image' in d){$('img').setAttribute('src',d.image||'');B.classList.toggle('noimg',!d.image)}
  if('items' in d){list=asList(d.items).map(function(x){if(x&&typeof x==='object')return {t:txt(x),m:x.time||x.when||''};
    var s=String(x).split('|');return {t:s[0].trim(),m:(s[1]||'').trim()}}).filter(function(x){return x.t});li=-1;delete $('sw').dataset.n;step();startRot()}
  if(!list.length&&('title' in d||'time' in d))put(data.title||'',data.time||'');
  if('interval' in d)startRot()}
function onPlay(){startRot()}
function onStop(){clearInterval(rot)}
function onNext(){step();startRot()}
B.classList.add('noimg');
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(function(){fit($('ti'),.72)});
</script>
</body>
</html>
