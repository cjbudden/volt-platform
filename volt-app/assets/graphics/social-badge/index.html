var ALIAS={fb:'facebook',ig:'instagram',insta:'instagram',tt:'tiktok',yt:'youtube',twitter:'x',wa:'whatsapp',tg:'telegram',bsky:'bluesky',weixin:'wechat'};
function key(p){p=String(p||'').trim().toLowerCase().replace(/^@/,'');return ALIAS[p]||p}
var plats=[],handles=[],hi=-1,rot=null,cur=null;
function list(v){var a=asList(v);if(a.length===1&&typeof a[0]==='string'&&a[0].indexOf(',')>=0)a=a[0].split(',');return a}
function drawIcons(){var box=$('icons');box.textContent='';var n=plats.length;
  plats.forEach(function(p,i){var g=GLYPHS[p];if(!g)return;var o=document.createElement('div');o.className='ico';o.dataset.p=p;
    o.style.setProperty('--i',i);o.style.setProperty('--r',n-1-i);
    var c=document.createElement('div');c.className='gl '+p+(g.full?' full':'');c.style.background=g.bg;
    c.innerHTML='<svg viewBox="0 0 24 24" role="img" aria-label="'+g.title+'"><path d="'+g.d+'"/></svg>';
    if(g.full)c.querySelector('svg').style.fill=g.hex;o.appendChild(c);box.appendChild(o)});
  box.style.display=box.childNodes.length?'':'none'}
function show(text){text=text==null?'':String(text);if(cur&&cur.textContent===text)return;
  var n=document.createElement('div');n.className='in';n.textContent=text;$('hdt').appendChild(n);
  var o=cur;cur=n;void n.offsetWidth;n.className='';if(o){o.className='gone';setTimeout(function(){o.remove()},500)}}
function highlight(p){[].forEach.call(document.querySelectorAll('.gl'),function(g){g.classList.toggle('dim',!!p&&g.parentNode.dataset.p!==p)})}
function step(){if(!handles.length){highlight(null);show(data.handle||'');return}
  hi=(hi+1)%handles.length;var h=handles[hi];highlight(h.p);show(h.h)}
function startRot(){clearInterval(rot);if(playing&&handles.length>1)rot=setInterval(step,Math.max(2,Number(data.interval)||5)*1000)}
function update(raw){var d=parse(raw);for(var k in d)data[k]=d[k];
  css('--lb',d.labelColor);css('--hd',d.handleColor);css('--ip',d.iconPanel);
  if('label' in d)setText($('lbl'),d.label||'');
  if('position' in d){B.classList.remove('pos-tl','pos-br','pos-bl');var p=String(d.position||'').toLowerCase();
    if(p==='top-left')B.classList.add('pos-tl');if(p==='bottom-right')B.classList.add('pos-br');if(p==='bottom-left')B.classList.add('pos-bl')}
  if('iconStyle' in d)B.classList.toggle('mono',String(d.iconStyle).toLowerCase()==='mono');
  if('platforms' in d){plats=list(d.platforms).map(key).filter(function(p){return GLYPHS[p]});drawIcons()}
  if('handles' in d){handles=list(d.handles).map(function(x){if(x&&typeof x==='object')return {p:key(x.platform||x.p),h:x.handle||x.h||''};
      var s=String(x).split('|');return s.length>1?{p:key(s[0]),h:s.slice(1).join('|').trim()}:{p:null,h:s[0].trim()}}).filter(function(h){return h.h});
    hi=-1;step();startRot()}
  else if('handle' in d&&!handles.length)show(d.handle||'');
  if('interval' in d)startRot()}
function onPlay(){startRot()}
function onStop(){clearInterval(rot)}
function onReset(){if(handles.length){hi=-1;step()}}
function onNext(){step();startRot()}
