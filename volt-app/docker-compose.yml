services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: volt
      POSTGRES_PASSWORD: volt
      POSTGRES_DB: volt
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d   # auto-applies 0001_init.sql on first boot
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U volt"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    # The context is the REPOSITORY ROOT because the image builds the console
    # too and volt-web is a sibling of volt-app. Run compose from volt-app as
    # before; the ".." is what lets one image serve both.
    build:
      context: ..
      dockerfile: volt-app/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://volt:volt@db:5432/volt
      JWT_ACCESS_SECRET: dev-access
      JWT_REFRESH_SECRET: dev-refresh
      PORT: "8080"
      # The console is served by this container on the same origin, so CORS is
      # not in play for it. Kept permissive only for the Vite dev server, which
      # a developer may still point at this API.
      CORS_ORIGIN: http://localhost:5173
      # Radio as a launched container writing HLS and DASH (no relay, 2.1c-2).
      RADIO_MODE: container
      # Image service (docs/IMAGES.md). The image runs with NODE_ENV=production,
      # which refuses the built-in dev secret, so compose sets a local one.
      # Never reuse this value anywhere real.
      IMAGE_SIGNING_SECRET: local-compose-image-signing-secret-not-for-production
      PUBLIC_BASE_URL: http://localhost:8080
      # Library + derivative cache on the container disk (the images volume).
      # To run the cloud S3 code path locally instead, add the S3 override:
      #   docker compose -f docker-compose.yml -f docker-compose.s3.yml up --build
    volumes:
      - images:/app/image-store
    ports:
      - "8080:8080"

volumes:
  dbdata:
  images:
